<section class="skills" id="skills">
  <div class="container">
    <div class="section-header">
      <p class="section-label">02. Skills</p>
      <h2 class="section-title">Tech Stack</h2>
      <p class="section-subtitle">
        A curated set of technologies I use to build reliable, scalable, and beautiful applications.
      </p>
    </div>

    <!-- Category Filter -->
    <div class="filter-tabs">
      <button
        *ngFor="let cat of categories"
        [class.active]="activeCategory === cat"
        (click)="setCategory(cat)">
        {{ cat }}
      </button>
    </div>

    <!-- Skills Grid -->
    <div class="skills-grid">
      <div class="skill-item" *ngFor="let skill of filteredSkills">
        <div class="skill-header">
          <span class="skill-name">{{ skill.name }}</span>
          <span class="skill-level">{{ skill.level }}%</span>
        </div>
        <div class="skill-bar">
          <div class="skill-fill" [style.width]="skill.level + '%'"></div>
        </div>
        <span class="skill-category">{{ skill.category }}</span>
      </div>
    </div>

    <!-- Tools section -->
    <div class="tools-section">
      <p class="tools-label">// Also familiar with</p>
      <div class="tools-list">
        <span *ngFor="let tool of ['Figma', 'Postman', 'Linux', 'GitHub Actions',  'Vercel', 'Netlify']">
          {{ tool }}
        </span>
      </div>
    </div>
  </div>
</section>
