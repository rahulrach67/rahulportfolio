<nav class="navbar" [class.scrolled]="scrolled">
  <div class="nav-inner">

    <a class="logo" (click)="scrollTo('#hero')">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-name">AP</span>
      <span class="logo-bracket">/&gt;</span>
    </a>

    <!-- Desktop Nav -->
    <ul class="nav-links">
      <li *ngFor="let link of navLinks">
        <a (click)="scrollTo(link.href)">{{ link.label }}</a>
      </li>
      <li>
        <a class="btn-resume" href="assets/resume.pdf" target="_blank">Resume</a>
      </li>
    </ul>

    <!-- Mobile Hamburger -->
    <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <ul>
      <li *ngFor="let link of navLinks; let i = index">
        <a (click)="scrollTo(link.href)" [style.animationDelay]="(i * 0.08) + 's'">{{ link.label }}</a>
      </li>
      <li>
        <a class="btn-resume mobile-resume" href="assets/resume.pdf" target="_blank">Resume ↗</a>
      </li>
    </ul>
  </div>
</nav>
